# ============================================================
# Hugo 站点自动构建并发布到 GitHub Pages
# ============================================================
# 工作流做了什么：
#   内容仓库（hugo-blogs-contents）推送更新
#     -> 检出内容 + 检出主题仓库
#     -> make oss-replace：列举 OSS 上已有的图片，把 md 里的本地图片链接换成 OSS URL
#     -> make build-ci：用 Hugo 构建出静态文件（public/）
#     -> 把 public/ 推送到 quhongbin/quhongbin.github.io
#
# 为什么图片要这样处理：
#   static/ 目录没有纳入 git（见 .gitignore），CI 检出代码后根本不存在图片文件，
#   本地那套「上传图片 + render hook 读 data/oss-images.json」在 CI 里用不了。
#   所以 CI 改为：不上传，只列举 OSS 上已有的对象，按文件名反查出 URL，
#   直接改写工作区里 md 的本地图片链接。改动只存在于这次构建的临时工作区，
#   不会回流到仓库——仓库里的 md 源文件始终保持本地相对路径。
#
# ⚠️ 由此带来的硬性工作流约束（最重要的一条）：
#   新增或修改图片后，必须先在本地跑一次 `make build` 把图片上传到 OSS，
#   再推代码。CI 只在 OSS 上找已经存在的图片，不会替你上传。
#   忘记上传的后果：那张图在 OSS 上查不到，链接保持本地路径，站点上是坏图，
#   构建日志里会有告警（把 STRICT 设成 1 可以让这种情况直接构建失败）。
#
# 首次使用需要做的事（只做一次）：
#   1. 创建一个有写权限的 Personal Access Token，
#      在本仓库 Settings -> Secrets and variables -> Actions -> New repository secret
#      添加名为 GH_PAT 的密钥（下面详细说明）。
#   2. 配置阿里云 OSS 只读凭证，同样加到 Secrets 里：
#        OSS_ACCESS_KEY_ID      AccessKey ID
#        OSS_ACCESS_KEY_SECRET  AccessKey Secret
#      CI 只列举对象，RAM 子账号授予 oss:ListObjects 即可，不需要写权限
#      （本地 make build 上传才需要 oss:PutObject）。详见文件末尾附录。
#   3. 目标仓库 quhongbin.github.io 的 Settings -> Pages，
#      Build and deployment -> Source 选择 "Deploy from a branch"，
#      Branch 选 main、目录选 / (root)，保存。
# ------------------------------------------------------------

# 工作流名称，会显示在仓库 Actions 页面和提交记录的绿色对勾上。
name: 部署博客到 GitHub Pages

# ============================================================
# 触发条件
# ============================================================
on:
  # 推送代码到 main 分支时自动运行。
  # 如果本地默认分支叫 master，把这里的 main 改掉，否则不会触发。
  push:
    branches:
      - main
    # 可选的路径过滤：只有这些路径下的文件变化才触发构建。
    # 用途：改 README、AGENTS.md 这类与站点无关的文件时不必跑一次构建。
    # 需要启用就删掉下面的 # 号。注意 hugo.yaml 和 .github/ 一定要保留在里面，
    # 否则改了配置或工作流本身不会重新部署。
    # paths:
    #   - 'content/**'
    #   - 'static/**'
    #   - 'hugo.yaml'
    #   - '.github/**'

  # 允许在 Actions 页面手动点 "Run workflow" 触发，方便不推代码也重新部署一次
  #（比如改了目标仓库的 Pages 设置之后）。
  workflow_dispatch:

  # 可选：让主题仓库（hugo-theme）更新时也自动重新构建。
  # 启用方法：在主题仓库里加一个 workflow，内容见本文件末尾注释。
  # repository_dispatch:
  #   types: [theme-updated]

# ============================================================
# 权限
# ============================================================
# 遵循最小权限原则：这里只给读权限。
# 推送到目标仓库用的是下面步骤里的 GH_PAT，不是内置的 GITHUB_TOKEN，
# 因为 GITHUB_TOKEN 只能操作当前仓库，没有跨仓库推送的权限。
permissions:
  contents: read

# ============================================================
# 并发控制
# ============================================================
# 短时间内连续推送时，避免多个构建同时跑、互相覆盖发布结果。
# cancel-in-progress: false = 排队等前一个跑完再跑，保证最后一次推送的内容最终生效。
# 若改成 true，则新任务会取消正在跑的旧任务，速度更快但可能漏掉中间某次提交。
concurrency:
  group: deploy-to-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # 运行环境。ubuntu-latest 即可，Hugo 构建很快（本项目约 1 分钟内完成）。
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. 检出内容仓库（本仓库）
      # ------------------------------------------------------------
      - name: 检出内容仓库
        uses: actions/checkout@v4
        with:
          # fetch-depth: 1 = 只拉最近一次提交，速度最快。
          # 如果 hugo.yaml 里把 enableGitInfo 改成了 true（用于显示文章最后修改时间），
          # 这里必须改成 0（拉取完整历史），否则拿不到文件的提交时间。
          fetch-depth: 1

      # ------------------------------------------------------------
      # 2. 检出主题仓库
      # ------------------------------------------------------------
      # 本站点的内容仓库与主题仓库是分开的两个 git 仓库（hugo.yaml 里
      # themesDir: ../ 指向同级的 hugo-theme），所以 CI 里必须单独拉一份主题。
      - name: 检出主题仓库
        uses: actions/checkout@v4
        with:
          # 主题仓库的完整名称，格式是「用户名/仓库名」。
          repository: quhongbin/hugo-theme
          # 要拉取的分支。主题仓库默认分支是 main。
          # 若想锁定主题版本，可以改成标签名或具体的 commit SHA（推荐，避免主题改版把站点搞崩）。
          ref: main
          # 跨仓库检出必须提供 token，即使是公开仓库也一样。
          # GH_PAT 需要在仓库 Settings -> Secrets 里配置，见文件末尾说明。
          token: ${{ secrets.GH_PAT }}
          # 检出到工作区内的 themes/hugo-theme，
          # 与 .github/hugo-ci.yaml 里的 themesDir: themes 对应，两者要一起改。
          path: themes/hugo-theme
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. 安装 Hugo
      # ------------------------------------------------------------
      - name: 安装 Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # 锁定版本，保证每次构建结果一致、不受上游发布影响。
          # 主题 hugo-theme 的 theme.toml 要求最低 0.158.0，0.165.0 满足要求。
          # 升级版本时，建议本地先跑通再改这里，否则 CI 会直接失败。
          hugo-version: '0.165.0'
          # extended 扩展版，包含 Sass/SCSS 编译、图片处理(WebP/裁剪)等能力。
          # 当前主题只用纯 CSS，但开着没有副作用，将来主题用到 SCSS 也不会构建失败。
          extended: true

      # ------------------------------------------------------------
      # 4. 安装 Go（用于编译 scripts/oss-replacer 链接替换工具）
      # ------------------------------------------------------------
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 直接从替换工具的 go.mod 里读取版本（当前 go 1.24），
          # 好处是本地和 CI 始终用同一个 Go 版本，不会因为 runner 预装版本漂移。
          go-version-file: scripts/oss-replacer/go.mod
          # 缓存 Go 模块：key 由 go.sum 内容生成，依赖没变时直接命中缓存，
          # 省掉每次构建都重新下载 OSS SDK 的时间。
          cache-dependency-path: scripts/oss-replacer/go.sum

      # ------------------------------------------------------------
      # 5. 把 md 里的本地图片链接替换为 OSS URL
      # ------------------------------------------------------------
      # 工具会列举 OSS bucket 里 blog-images/ 下的全部对象，按文件名反查出
      # 公开 URL，然后改写 content/**/*.md 中的本地引用。
      # 只有这一步需要 OSS 凭证，下一步构建完全拿不到 AccessKey。
      - name: 替换图片链接为 OSS URL
        env:
          # ---- OSS 凭证 ----
          # 上传工具与替换工具都用 SDK 的 NewEnvironmentVariableCredentialsProvider()
          # 读取这两个变量，变量名不能改。
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          # ---- OSS 桶配置 ----
          # 这几项在 Makefile 里都有默认值，这里显式写出来是为了方便在 CI 侧覆盖，
          # 换桶/换地域改这里即可，不用动 Makefile。
          OSS_REGION: cn-shenzhen
          OSS_BUCKET_NAME: blog-cetkit
          OSS_IMAGE_PREFIX: blog-images/
          # 若绑定了 CDN 自定义域名，填到这里（末尾不要带 /），留空则用 OSS 默认域名。
          OSS_CUSTOM_DOMAIN: ''
          # 严格模式：0 = 有图片在 OSS 上找不到时只告警、继续构建；
          #          1 = 直接让这一步失败，防止坏图悄悄上线。
          # 想把「忘传图片」变成硬失败就改成 1。
          STRICT: '0'
        run: |
          # 凭证缺失时给一句人话提示，避免只看到 SDK 报的 "credentials not found"
          if [ -z "$OSS_ACCESS_KEY_ID" ] || [ -z "$OSS_ACCESS_KEY_SECRET" ]; then
            echo "::error::缺少 OSS 凭证，请在本仓库 Settings -> Secrets and variables -> Actions 配置 OSS_ACCESS_KEY_ID 与 OSS_ACCESS_KEY_SECRET"
            exit 1
          fi
          # Makefile 里的 OSS_*、STRICT 都是 `?=` 声明，env 里的值会直接生效，
          # 不用再往命令行上重复传一遍。工具会把替换处数、缺失清单打到日志里。
          make oss-replace

      # ------------------------------------------------------------
      # 6. 构建站点
      # ------------------------------------------------------------
      # 走 make 而不是直接调 hugo，与本地 `make build` 共用同一套构建逻辑。
      - name: 构建静态站点
        env:
          # TZ：把容器时区设为上海。hugo.yaml 里虽已配 timeZone: Asia/Shanghai，
          # 这里再设一次更保险，避免「未来时间的文章」因时区偏差被判定为未发布而不输出。
          TZ: Asia/Shanghai
          # HUGO_EXTRA_ARGS 是 Makefile 提供的透传变量，用来给 hugo 追加参数。
          # --config 用逗号分隔多份配置，后者覆盖前者：
          #   hugo.yaml              主配置（内容与本地开发共用）
          #   .github/hugo-ci.yaml   CI 专用覆盖（themesDir 指向仓库内、baseURL 改成真实域名）
          # 注意：不要用 --themesDir 覆盖主题目录，实测会被 hugo.yaml 的值覆盖回去导致报
          #       "module hugo-theme not found"，只能通过追加配置文件的方式覆盖。
          # --minify 由 Makefile 固定带上，这里不用重复传。
          # 引号在经过 make 展开后仍然正确，展开结果是：
          #   hugo --config "hugo.yaml,.github/hugo-ci.yaml" --minify
          HUGO_EXTRA_ARGS: '--config "hugo.yaml,.github/hugo-ci.yaml"'
        run: |
          make build-ci
          # 构建产物会输出到 public/（已在 .gitignore 中忽略，不会进内容仓库）。

      # ------------------------------------------------------------
      # 7. 推送到 <用户名>.github.io 仓库
      # ------------------------------------------------------------
      - name: 发布到 quhongbin.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          # 跨仓库推送必须用 PAT（内置 GITHUB_TOKEN 只作用于本仓库）。
          personal_token: ${{ secrets.GH_PAT }}
          # 目标仓库，格式「用户名/仓库名」。GitHub Pages 用户站的固定命名规则是
          # <用户名>.github.io，访问地址就是 https://quhongbin.github.io/。
          external_repository: quhongbin/quhongbin.github.io
          # 推送到目标仓库的哪个分支。该仓库默认分支是 main，
          # 并且 Pages 的发布源要设置成这个分支（根目录），两者必须一致。
          publish_branch: main
          # 要发布哪个目录。Hugo 默认输出到 public/，与上面构建步骤的产物对应。
          publish_dir: ./public
          # 是否每次都清空目标分支的历史、只留一个全新提交。
          #   true（当前值）：每次部署都是单个 commit，仓库不会随构建次数无限膨胀；
          #                  目标分支上原本存在的其他文件也会被清掉。
          #   false         ：保留历史提交，适合目标仓库里还放了别的东西的情况。
          # ⚠️ 注意：无论 true 还是 false，目标分支上「不在 public/ 里的文件」都会被删除
          #    （例如旧的 Hexo 站点产物）。如需保留旧站内容，请先手动备份一份。
          force_orphan: true
          # 生成的 commit 作者信息，显示在目标仓库的提交记录里。
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          # 提交信息。push 触发时带上原始 commit message，手动触发时用固定文案。
          # || 是 GitHub 表达式语法：左边为空则取右边。
          commit_message: "${{ github.event.head_commit.message || format('手动触发部署 {0}', github.sha) }}"
          # 若绑定了自定义域名，取消下面这行的注释，会自动在站点根目录生成 CNAME 文件。
          # 不绑域名就不用管，保持注释状态。
          # cname: www.example.com

# ============================================================
# 附录：如何创建 GH_PAT（只需做一次）
# ============================================================
# 方式一（推荐）：Fine-grained token，权限更精确
#   1. GitHub 右上角头像 -> Settings -> Developer settings
#      -> Personal access tokens -> Fine-grained tokens -> Generate new token
#   2. Resource owner 选 quhongbin，Repository access 选 "Only select repositories"，
#      勾选以下三个仓库：
#        - hugo-blogs-contents  （权限：Contents = Read-only，用于读取代码）
#        - hugo-theme           （权限：Contents = Read-only，用于检出主题；私有主题才需要，公开仓库也需要 token 才能跨仓库 checkout）
#        - quhongbin.github.io  （权限：Contents = Read and write，用于推送构建产物）
#   3. 生成后复制，到 hugo-blogs-contents 仓库
#      Settings -> Secrets and variables -> Actions -> New repository secret，
#      Name 填 GH_PAT，Secret 粘贴刚才的 token，保存。
#
# 方式二：Classic token（更简单，但权限范围大）
#   1. Settings -> Developer settings -> Personal access tokens -> Tokens (classic)
#      -> Generate new token (classic)
#   2. 勾选 repo（完整仓库读写权限），其余保持不勾。
#   3. 同样存成 hugo-blogs-contents 仓库的 secret，名字叫 GH_PAT。
#
# 备注：
#   - token 有过期时间，过期后部署会失败，重新生成一个同名 secret 覆盖即可。
#   - secret 一旦保存就再也看不到内容，只能覆盖，不能查看，请自行保管好。
#
# ============================================================
# 附录：如何获取阿里云 OSS 凭证（只需做一次）
# ============================================================
#   1. 阿里云控制台 -> 右上角头像 -> AccessKey 管理。
#      推荐使用 RAM 子账号的 AccessKey，不要用主账号。
#   2. 给该子账号授予最小权限的自定义策略（资源限定到目标 bucket）：
#         oss:ListObjects  —— CI 列举已有图片、反查 URL 用（本工作流需要）
#         oss:PutObject    —— 本地 make build 上传图片用（CI 不需要）
#         oss:GetObject    —— 便于排查（可选）
#      一个 AccessKey 同时给本地和 CI 用，那三个都勾上最省事；
#      想严格分开，就建两个子账号，CI 那个只给 oss:ListObjects。
#   3. 到 hugo-blogs-contents 仓库 Settings -> Secrets and variables -> Actions
#      新增两个 secret：
#         OSS_ACCESS_KEY_ID      = AccessKey ID
#         OSS_ACCESS_KEY_SECRET  = AccessKey Secret
#   4. bucket 必须允许公共读，否则图片上传成功但页面加载不出来。
#      如需私有 bucket，要改用 STS 临时凭证或签名 URL，当前工具只支持固定 AK。
#
# ============================================================
# 附录：日常写作流程（改动图片时必看）
# ============================================================
#   1. 用 org-mode 写完、ox-hugo 导出 md，图片落在 static/ox-hugo/ 下。
#   2. 本地跑 `make build`：把新图片上传到 OSS，并生成本地预览用的
#      data/oss-images.json。这一步会真实写 OSS，是图片进入 OSS 的唯一途径。
#   3. 本地 `make dev` 预览确认无误后，git commit + push。
#      注意 static/ 与 data/oss-images.json 都在 .gitignore 里，不会被提交，
#      仓库里只有 md 和工具源码。
#   4. 推送触发本工作流：CI 列举 OSS 上已有的图片，按文件名反查出 URL，
#      改写 md 里的本地链接，然后构建发布。
#
#   忘了第 2 步会怎样：
#     新图片在 OSS 上不存在，CI 查不到，链接保持本地路径，站点上显示坏图。
#     构建日志里会有「以下 N 个图片在 OSS 上找不到对应对象」的告警，
#     把上面 STRICT 改成 '1' 可以让这种情况直接把构建判失败。
#
#   关于匹配精度：
#     只按文件名匹配，不校验内容。若两张不同内容的图片恰好同名，
#     工具会选最后修改时间最新的那个，并在日志里打印冲突告警。
#     想避免，就保证图片文件名全局唯一（ox-hugo 的截图命名本身带时间戳，基本不会撞）。
#
# ============================================================
# 附录（可选）：主题仓库更新时自动重新部署
# ============================================================
# 如果希望改了主题也能自动更新线上站点，在 hugo-theme 仓库里加
# .github/workflows/notify-content.yml，内容如下：
#
#   name: 通知内容仓库重新部署
#   on:
#     push:
#       branches: [main]
#   jobs:
#     notify:
#       runs-on: ubuntu-latest
#       steps:
#         - name: 触发内容仓库 workflow
#           run: |
#             curl -X POST \
#               -H "Accept: application/vnd.github+json" \
#               -H "Authorization: Bearer ${{ secrets.CROSS_REPO_TOKEN }}" \
#               https://api.github.com/repos/quhongbin/hugo-blogs-contents/dispatches \
#               -d '{"event_type":"theme-updated"}'
#
# 其中 CROSS_REPO_TOKEN 是主题仓库里的 secret（需要有 hugo-blogs-contents 的写权限），
# 同时把本文件上方被注释的 repository_dispatch 那段取消注释。
