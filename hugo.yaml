markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false

minify:
  minifyOutput: true

privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
  instagram:
    disable: true
  vimeo:
    disable: true
  x:
    disable: true
  youTube:
    disable: true
