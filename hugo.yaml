# ============================================================
# markup：内容渲染
# ============================================================

markup:
  goldmark:
    renderer:
      # 是否允许在 Markdown 中写原始 HTML。
      # false 为安全默认值；需要嵌入 iframe、视频标签等时改为 true。
      unsafe: false
  highlight:
    # 启用代码块语法高亮。
    codeFences: true
    # 代码块未标注语言时，自动猜测语言。
    guessSyntax: true
    # 是否显示行号。
    lineNos: false
    # true  = 高亮用内联 style（颜色写死）
    # false = 高亮用 CSS class，可跟随主题配色方案变化（推荐保持 false）
    noClasses: false

# ============================================================
# 其他
# ============================================================

# 执行 hugo --minify 时压缩 HTML / CSS / JS 产物。
minify:
  minifyOutput: true

# GDPR 隐私保护开关。
# disable: true 表示这些第三方服务在显式启用前不加载外部脚本、不写 cookie。
# 注意：这只是禁用隐私相关行为，并不等于接入了统计，
# 要接入统计还需在 params 中填写对应 ID 并由主题支持。
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
  instagram:
    disable: true
  vimeo:
    disable: true
  x:
    disable: true
  youTube:
    disable: true
